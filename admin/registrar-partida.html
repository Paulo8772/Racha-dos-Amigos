<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Registrar partida — Racha dos Amigos</title>

<link rel="icon" href="../assets/icons/favicon.png">

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap"
  rel="stylesheet"
>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">

</head>

<body class="admin-body">

<main class="container admin-page admin-page--match">

<header class="admin-header admin-header--match">

<div>

<span class="eyebrow">
Admin
</span>

<h1>
Registrar partida
</h1>

</div>

<a
  href="dashboard.html"
  class="btn btn--secundario"
>
Voltar
</a>

</header>


<form
  id="partida-form"
  class="form-grid match-form"
>

<div class="form-group">

<label>
Temporada
</label>

<select
  id="season_id"
  name="season_id"
  class="input"
  required
></select>

</div>


<div class="form-group">

<label>
Rodada
</label>

<input
  type="number"
  name="round_number"
  class="input"
  min="1"
  required
>

</div>


<div class="form-group">

<label>
Data
</label>

<input
  type="date"
  name="match_date"
  class="input"
  required
>

</div>


<div class="form-group">

<label>
Local
</label>

<input
  type="text"
  name="location"
  class="input"
  placeholder="Ex.: Arena dos Amigos"
>

</div>


<div class="form-group">

<label>
Time A
</label>

<input
  type="text"
  name="team_a_name"
  class="input"
  value="Colete Verde"
  required
>

</div>


<div class="form-group">

<label>
Gols Time A
</label>

<input
  type="number"
  name="team_a_score"
  class="input"
  min="0"
  value="0"
  required
>

</div>


<div class="form-group">

<label>
Time B
</label>

<input
  type="text"
  name="team_b_name"
  class="input"
  value="Colete Preto"
  required
>

</div>


<div class="form-group">

<label>
Gols Time B
</label>

<input
  type="number"
  name="team_b_score"
  class="input"
  min="0"
  value="0"
  required
>

</div>


<div class="form-group full">

<label>
Observações
</label>

<textarea
  name="notes"
  class="input"
></textarea>

</div>


<div class="full">

<h2>
Jogadores
</h2>

<p>
Informe o time e as estatísticas
de cada jogador.
</p>

</div>


<div
  id="players-stats"
  class="card full"
></div>


<div class="full">

<button
  type="submit"
  class="btn btn--primario btn--bloco"
>
Registrar partida
</button>

</div>

</form>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/registrar-partida.js"></script>

</body>

</html>

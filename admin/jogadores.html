<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Gerenciar jogadores</title>

<link rel="icon" href="../assets/icons/favicon.png">

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap"
  rel="stylesheet"
>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">

</head>

<body class="admin-body">

<main class="container admin-page">

<header class="admin-header">

<div>

<span class="eyebrow">
Admin
</span>

<h1>
Jogadores
</h1>

</div>

<a
  href="dashboard.html"
  class="btn btn--secundario"
>
Voltar
</a>

</header>


<section class="secao">

<form
  id="novo-jogador"
  class="card form-grid"
>

<div class="form-group">

<label>
Nome
</label>

<input
  class="input"
  name="name"
  required
>

</div>


<div class="form-group">

<label>
Posição
</label>

<select
  class="input"
  name="position"
>

<option value="linha">
Jogador de linha
</option>

<option value="goleiro">
Goleiro
</option>

</select>

</div>


<div class="form-group">

<label>
Apelido
</label>

<input
  class="input"
  name="nickname"
>

</div>


<div class="form-group">

<label>
Número
</label>

<input
  class="input"
  type="number"
  name="number"
  min="1"
  max="99"
>

</div>


<div class="full">

<button
  class="btn btn--primario"
>
Adicionar jogador
</button>

</div>

</form>

</section>


<section class="secao">

<div
  id="admin-lista-jogadores"
  class="grid-1"
></div>

</section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>

<script>

document.addEventListener(
  "DOMContentLoaded",
  async () => {

    if (!await Auth.requireAdmin()) {
      return;
    }

    const list =
      document.querySelector(
        "#admin-lista-jogadores"
      );

    async function load() {

      const {
        data,
        error
      } = await supabaseClient
        .from("jogadores")
        .select("*")
        .order("nome");

      if (error) {
        App.handleError(error);
        return;
      }

      list.innerHTML =
        data.map(player => `

          <div class="card">

            <div class="card-jogador">

              ${App.avatar(player)}

              <div class="card-jogador__info">

                <strong
                  class="card-jogador__nome"
                >
                  ${App.escapeHTML(player.nome)}
                </strong>

                <div class="card-jogador__meta">

                  ${
                    player.posicao === "goleiro"
                      ? "Goleiro"
                      : "Linha"
                  }

                </div>

              </div>

            </div>

          </div>

        `).join("");
    }


    document
      .querySelector("#novo-jogador")
      .addEventListener(
        "submit",
        async event => {

          event.preventDefault();

          const form =
            event.currentTarget;

          const data =
            Object.fromEntries(
              new FormData(form)
            );

          const {
            error
          } = await supabaseClient
            .from("jogadores")
            .insert({
              nome: data.name,
              apelido: data.nickname || null,
              posicao: data.position
            });

          if (error) {

            App.handleError(
              error,
              "Não foi possível criar o jogador."
            );

            return;
          }

          form.reset();

          App.toast(
            "Jogador adicionado."
          );

          load();
        }
      );


    load();

  }
);

</script>

</body>
</html>

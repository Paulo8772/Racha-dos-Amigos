<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Gerenciar partidas</title>

<link rel="icon" href="../assets/icons/favicon.png">

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap"
  rel="stylesheet"
>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">

</head>

<body class="admin-body">

<main class="container admin-page">

<header class="admin-header">

<div>

<span class="eyebrow">
Admin
</span>

<h1>
Partidas
</h1>

</div>

<a
  href="dashboard.html"
  class="btn btn--secundario"
>
Voltar
</a>

</header>


<div
  id="admin-partidas"
  class="grid-1"
></div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>

<script>

document.addEventListener(
  "DOMContentLoaded",
  async () => {

    if (!await Auth.requireAdmin()) {
      return;
    }

    const container =
      document.querySelector(
        "#admin-partidas"
      );

    const {
      data,
      error
    } = await supabaseClient
      .from("partidas")
      .select(`
        *,
        temporadas (
          nome,
          ano
        )
      `)
      .order("data", {
        ascending: false
      });

    if (error) {

      App.handleError(error);
      return;

    }

    container.innerHTML =
      data.map(match => `

        <div class="card">

          <div class="match-card__meta">

            <span class="badge badge--verde">
              Rodada ${match.rodada}
            </span>

            <span>
              ${App.formatDate(
                match.data
              )}
            </span>

          </div>

          <div class="match-card__teams">

            <span>
              ${App.escapeHTML(
                "Colete Verde"
              )}
            </span>

            <div class="match-card__score">

              <strong>
                ${match.placar_verde}
              </strong>

              <small>×</small>

              <strong>
                ${match.placar_preto}
              </strong>

            </div>

            <span>
              ${App.escapeHTML(
                "Colete Preto"
              )}
            </span>

          </div>

        </div>

      `).join("");

  }
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Painel — Racha dos Amigos</title>

<link
  rel="icon"
  href="../assets/icons/favicon.png"
>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap"
  rel="stylesheet"
>

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">

</head>

<body class="admin-body">

<main class="container admin-page admin-layout">

<header class="admin-header">

<div>

<span class="eyebrow">
Administração
</span>

<h1>
Painel
</h1>

</div>

<button
  id="logout"
  class="btn btn--secundario"
>
Sair
</button>

</header>


<section class="secao">

<div class="grid-2">

<a
  href="jogadores.html"
  class="card card--link stat-card"
>

<span>
Jogadores
</span>

<strong id="admin-jogadores">
—
</strong>

</a>


<a
  href="partidas.html"
  class="card card--link stat-card"
>

<span>
Partidas
</span>

<strong id="admin-partidas">
—
</strong>

</a>


<a
  href="temporadas.html"
  class="card card--link stat-card"
>

<span>
Temporadas
</span>

<strong id="admin-temporadas">
—
</strong>

</a>


<a
  href="registrar-partida.html"
  class="card card--link stat-card"
>

<span>
Nova partida
</span>

<strong>
+
</strong>

</a>

</div>

</section>


<section class="secao">

<div class="secao__cabecalho">

<h2 class="secao__titulo">
Ações rápidas
</h2>

</div>

<div class="grid-1">

<a
  href="registrar-partida.html"
  class="btn btn--primario btn--bloco"
>
⚽ Registrar partida
</a>

<a
  href="jogadores.html"
  class="btn btn--secundario btn--bloco"
>
♙ Gerenciar jogadores
</a>

<a
  href="temporadas.html"
  class="btn btn--secundario btn--bloco"
>
◉ Gerenciar temporadas
</a>

</div>

</section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>

<script>

document.addEventListener(
  "DOMContentLoaded",
  async () => {

    const allowed =
      await Auth.requireAdmin();

    if (!allowed) return;

    const [
      players,
      matches,
      seasons
    ] = await Promise.all([

      supabaseClient
        .from("jogadores")
        .select("id", {
          count: "exact",
          head: true
        }),

      supabaseClient
        .from("partidas")
        .select("id", {
          count: "exact",
          head: true
        }),

      supabaseClient
        .from("temporadas")
        .select("id", {
          count: "exact",
          head: true
        })

    ]);

    document.querySelector(
      "#admin-jogadores"
    ).textContent =
      players.count || 0;

    document.querySelector(
      "#admin-partidas"
    ).textContent =
      matches.count || 0;

    document.querySelector(
      "#admin-temporadas"
    ).textContent =
      seasons.count || 0;


    document.querySelector(
      "#logout"
    ).addEventListener(
      "click",
      Auth.logout
    );

  }
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Admin — Racha dos Amigos</title>

<link
  rel="icon"
  href="../assets/icons/favicon.png"
>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap"
  rel="stylesheet"
>

<link
  rel="stylesheet"
  href="../css/style.css"
>

<link
  rel="stylesheet"
  href="../css/responsive.css"
>

</head>

<body class="admin-body admin-login-body">

<main class="login-page">

  <section class="login-card">

    <div class="login-brand">

      <img
        src="../assets/icons/logo.jpg"
        alt="Racha dos Amigos"
      >

      <span class="eyebrow">
        Área administrativa
      </span>

      <h1>
        Entrar
      </h1>

    </div>


    <form
      id="login-form"
      class="form-grid"
    >

      <div class="form-group">

        <label for="email">
          E-mail
        </label>

        <input
          id="email"
          name="email"
          type="email"
          class="input"
          autocomplete="email"
          required
        >

      </div>


      <div class="form-group">

        <label for="password">
          Senha
        </label>

        <input
          id="password"
          name="password"
          type="password"
          class="input"
          autocomplete="current-password"
          required
        >

      </div>


      <button
        type="submit"
        class="btn btn--primario btn--bloco"
      >
        Entrar no painel
      </button>

    </form>

  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>

</body>

</html>
